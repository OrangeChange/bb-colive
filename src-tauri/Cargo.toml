[package]
name = "bb-colive"
version = "1.2.0"
description = "B站直播弹幕桌面工具"
authors = ["橙橙子君（Orange）"]
license-file = "../LICENSE"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bb_colive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
regex = "1"
semver = "1"
minisign-verify = "0.3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
sha2 = "0.10"
tauri-plugin-http = { version = "2.5.9", features = ["unsafe-headers"] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri-plugin-store = "2.4.4"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "wav"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }

axum = { version = "0.8", features = ["ws"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Media_Core", "Media_SpeechSynthesis", "Storage_Streams", "Win32_Graphics_DirectWrite"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Security_Credentials",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
